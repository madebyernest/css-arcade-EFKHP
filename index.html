<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Arcade Cabinet — Activity 05 build challenge">
  <title>Tic-Tac-Turbo Arcade Cabinet - EFKHP</title>
  <!--
    Activity 05 · CSS Arcade Night · Round 3 Build
    Team Name: EFKHP
    Members / IDs: Ernest Fistik, Ki Hyun Park
    Theme: Retro Tic-Tac-Toe Cabinet
  -->
  <style>
    /* ==================================================
       0. DESIGN TOKENS (Checkpoint 6 — custom properties)
       ================================================== */
    :root {
      --bg: #0c0a1a;
      --surface: #16132b;
      --ink: #f8fafc;
      --neon-pink: #f472b6;
      --neon-cyan: #22d3ee;
      --neon-yellow: #fde047;
      --radius: 14px;
      --space: 1rem;
      --font-display: "Courier New", Courier, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 var(--space) calc(var(--space) * 2);
    }

    section { margin-top: calc(var(--space) * 2.5); }

    h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      margin-bottom: var(--space);
    }

    /* ==================================================
       1. FLEXBOX — Cabinet header & nav (Checkpoint 1)
       ================================================== */
    .cabinet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space);
      padding: var(--space) calc(var(--space) * 1.5);
      background: var(--surface);
      border-bottom: 3px solid var(--neon-pink);
      box-shadow: 0 6px 24px rgba(244, 114, 182, 0.35);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .cabinet-nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--space);
    }

    .cabinet-nav a {
      color: var(--ink);
      text-decoration: none;
      font-family: var(--font-display);
      padding: 0.4rem 0.9rem;
      border: 2px solid var(--neon-pink);
      border-radius: var(--radius);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* ==================================================
       2. CSS GRID — Game board (Checkpoint 2)
       ================================================== */
    .game-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      margin: 0 auto;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 2px solid rgba(34, 211, 238, 0.4);
      border-radius: var(--radius);
      padding: var(--space);
      min-height: 100px;
      font-family: var(--font-display);
      font-size: clamp(2rem, 9vw, 3.5rem);
      font-weight: bold;
    }

    .x { color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); }
    .o { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan); }

    /* Winning line drawn across the 1-5-9 diagonal */
    .win-line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 125%;
      height: 10px;
      border-radius: 5px;
      background: var(--neon-yellow);
      box-shadow: 0 0 16px var(--neon-yellow);
      transform: translate(-50%, -50%) rotate(45deg) scaleX(0);
      pointer-events: none;
      z-index: 2;
    }

    /* ==================================================
       3. ANIMATION — Attract-mode motion (Checkpoint 3)
       ================================================== */
    .marquee-text {
      text-align: center;
      color: var(--neon-yellow);
      text-shadow: 0 0 10px var(--neon-yellow);
      letter-spacing: 0.15em;
    }

    @keyframes strike {
      0%   { transform: translate(-50%, -50%) rotate(45deg) scaleX(0); background: var(--neon-cyan); }
      50%  { transform: translate(-50%, -50%) rotate(45deg) scaleX(1.1); background: var(--neon-pink); }
      100% { transform: translate(-50%, -50%) rotate(45deg) scaleX(1); background: var(--neon-yellow); }
    }

    @keyframes blink {
      0%   { transform: scale(1); color: var(--neon-yellow); }
      50%  { transform: scale(1.12); color: var(--neon-pink); }
      100% { transform: scale(1); color: var(--neon-yellow); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .win-line {
        animation: strike 1.6s ease-in-out 1s both;
      }
      .marquee-text {
        animation: blink 1.4s ease-in-out 0.3s 3 both;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .win-line {
        transform: translate(-50%, -50%) rotate(45deg) scaleX(1);
      }
    }

    /* ---- High scores ---- */
    .score-list {
      max-width: 420px;
      margin: 0 auto;
      padding-left: 2rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--neon-cyan);
    }

    /* ==================================================
       4. POSITIONING + Z-INDEX — Layered piece (Checkpoint 4)
       Pure-CSS art: cabinet body, joystick, winner badge.
       ================================================== */
    .layer-stack {
      position: relative;
      min-height: 260px;
      max-width: 420px;
      margin: 0 auto;
    }

    .layer {
      position: absolute;
    }

    .layer-back {
      inset: 0;
      z-index: 1;
      border-radius: var(--radius) var(--radius) 0 0;
      border: 3px solid var(--neon-cyan);
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 6px),
        linear-gradient(160deg, #2a2160, #100c2e);
      color: transparent;
      font-size: 0;
    }

    .layer-mid {
      left: 50%;
      bottom: 24px;
      width: 16px;
      height: 90px;
      margin-left: -8px;
      z-index: 5;
      border-radius: 8px;
      background: #cbd5e1;
      color: transparent;
      font-size: 0;
    }

    .layer-mid::before {
      content: "";
      position: absolute;
      top: -26px;
      left: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fda4af, var(--neon-pink) 60%, #9d174d);
      box-shadow: 0 0 18px var(--neon-pink);
    }

    .layer-front {
      top: 24px;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius);
      background: var(--neon-yellow);
      color: #1e1b4b;
      font-family: var(--font-display);
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 0 20px var(--neon-yellow);
    }

    /* ==================================================
       5. INTERACTION — hover + focus (Checkpoint 5)
       ================================================== */
    .tile {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 0 18px var(--neon-cyan);
    }

    .cabinet-nav a:hover,
    .cabinet-nav a:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 0 14px var(--neon-pink);
    }

    .tile:focus-visible,
    .cabinet-nav a:focus-visible {
      outline: 3px solid var(--neon-yellow);
      outline-offset: 3px;
    }

    .cabinet-footer {
      padding: var(--space);
      text-align: center;
      background: var(--surface);
      font-size: 0.875rem;
    }

    /* ==================================================
       6. RESPONSIVE — max-width: 768px (Checkpoint 6)
       ================================================== */
    @media (max-width: 768px) {
      .cabinet-header {
        flex-direction: column;
        text-align: center;
      }

      .cabinet-nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .game-grid {
        max-width: 320px;
        gap: 0.5rem;
      }

      .tile {
        min-height: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <header class="cabinet-header">
    <h1 class="logo">Tic-Tac-Turbo</h1>
    <nav class="cabinet-nav" aria-label="Cabinet">
      <a href="#play">Play</a>
      <a href="#scores">High Scores</a>
      <a href="#merch">Cabinet</a>
    </nav>
  </header>

  <main>
    <section id="play" aria-labelledby="play-title">
      <h2 id="play-title" class="marquee-text">Press Start</h2>
      <div class="game-grid">
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="win-line"></div>
      </div>
    </section>

    <section id="scores" aria-labelledby="scores-title">
      <h2 id="scores-title">High Scores</h2>
      <ol class="score-list">
        <li>AAA · 9,999</li>
        <li>BBB · 7,500</li>
        <li>CCC · 5,000</li>
      </ol>
    </section>

    <section id="merch" aria-labelledby="merch-title">
      <h2 id="merch-title">Layered Showpiece</h2>
      <div class="layer-stack">
        <div class="layer layer-back">Cabinet screen</div>
        <div class="layer layer-mid">Joystick</div>
        <div class="layer layer-front">PLAYER 1 WINS</div>
      </div>
    </section>
  </main>

  <footer class="cabinet-footer">
    <p>&copy; 2026 EFKHP - Activity 05</p>
  </footer>
</body>
</html>
